spring:
  profiles:
    active: local
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:dev@example.com}
    password: ${MAIL_PASSWORD:dev-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: jdbc:mysql://localhost:3306/i_route_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${I_ROUTE_DB_USERNAME}
    password: ${I_ROUTE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100

  mvc:
    async:
      request-timeout: 180000

logging:
  level:
    org.hibernate.SQL: debug

server:
  error:
    include-message=always:

jwt:
  secret: ${JWT_SECRET}
  expiration: 1800000
  refresh-expiration: 1209600000

kakao:
  client-id: ${KAKAO_CLIENT_ID:dev-kakao-client-id}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/kakao/callback}
  mobility:
    base-url: https://apis-navi.kakaomobility.com
    rest-api-key: ${KAKAO_REST_API_KEY:dev-kakao-rest-api-key}

toss:
  client-key: ${TOSS_CLIENT_KEY:test_ck_placeholder}
  secret-key: ${TOSS_SECRET_KEY:test_sk_placeholder}

email:
  verification-expiration: 3600
  base-url: "http://localhost:8080"

ai:
  server:
    url: http://localhost:8082
