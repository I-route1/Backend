spring:
  datasource:
    url: jdbc:mysql://localhost:3306/i_route_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${I_ROUTE_DB_USERNAME}
    password: ${I_ROUTE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  kakao:
    mobility:
      base-url: https://apis-navi.kakaomobility.com
      rest-api-key: ${KAKAO_REST_API_KEY}

  logging:
    level:
      org.hibernate.SQL: debug