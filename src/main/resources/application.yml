spring:
  profiles:
    active: local

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    url: jdbc:mysql://localhost:3306/i_route_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${I_ROUTE_DB_USERNAME}
    password: ${I_ROUTE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100

  mvc:
    async:
      request-timeout: 180000

logging:
  level:
    org.hibernate.SQL: debug

server:
  error:
    include-message: always

jwt:
  secret: ${JWT_SECRET}
  expiration: 1800000
  refresh-expiration: 1209600000

kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI}
  mobility:
    base-url: https://apis-navi.kakaomobility.com
    rest-api-key: ${KAKAO_REST_API_KEY}

email:
  verification-expiration: 3600
  base-url: "https://d3kh3x870d7dr4.cloudfront.net"

app:
  verification-expiration: 3600
  frontend-base-url: "https://d3kh3x870d7dr4.cloudfront.net"

ai:
  server:
    url: http://14.56.197.183:8082

toss:
  secret-key: test_sk_dummy
  client-key: test_ck_dummy