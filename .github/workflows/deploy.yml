name: Deploy Backend to EC2

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_ACCOUNT_ID: '363183905447'
      AWS_REGION: ap-southeast-2
      BACKEND_RELEASE_BUCKET: ${{ vars.BACKEND_RELEASE_BUCKET }}
      BACKEND_INSTANCE_ID: ${{ vars.BACKEND_INSTANCE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: corretto
          cache: gradle

      - name: Verify runtime settings deployment code
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Test and build JAR
        run: |
          chmod +x gradlew
          ./gradlew check bootJar --no-daemon

      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Upload release and deploy through Systems Manager
        shell: bash
        run: |
          set -euo pipefail
          : "${BACKEND_RELEASE_BUCKET:?Set the production releases bucket}"
          : "${BACKEND_INSTANCE_ID:?Set the production instance ID}"
          [[ "$BACKEND_RELEASE_BUCKET" == i-route-backend-* ]]
          [[ "$BACKEND_INSTANCE_ID" =~ ^i-[0-9a-f]{17}$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          shopt -s nullglob
          jars=(build/libs/backend-*-SNAPSHOT.jar)
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo 'Expected one executable backend JAR.' >&2
            exit 1
          fi
          jar=${jars[0]}
          digest=$(sha256sum "$jar" | cut -d ' ' -f 1)
          aws s3api put-object --bucket "$BACKEND_RELEASE_BUCKET" \
            --expected-bucket-owner "$AWS_ACCOUNT_ID" --key "releases/$GITHUB_SHA.jar" \
            --body "$jar" >/dev/null
          command_id=$(aws ssm send-command --instance-ids "$BACKEND_INSTANCE_ID" \
            --document-name IRouteDeployBackend --parameters "Version=$GITHUB_SHA,Digest=$digest" \
            --timeout-seconds 300 --query Command.CommandId --output text)
          echo "Systems Manager deployment command: $command_id"
          for attempt in {1..60}; do
            if status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$BACKEND_INSTANCE_ID" --query Status --output text 2>/dev/null); then
              case "$status" in
                Success) echo "Backend release $GITHUB_SHA passed its health check."; exit 0 ;;
                Failed|TimedOut|Cancelled|Cancelling) echo "Deployment ended with $status." >&2; exit 1 ;;
              esac
            fi
            sleep 5
          done
          echo 'Timed out waiting for the Systems Manager deployment.' >&2
          exit 1
