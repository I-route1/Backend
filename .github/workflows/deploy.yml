name: Deploy Backend to EC2

on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Build JAR
        run: chmod +x gradlew && ./gradlew bootJar -x test

      - name: Deploy to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          source: build/libs/*-SNAPSHOT.jar
          target: /home/ec2-user/
          strip_components: 2

      - name: Restart Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            mv /home/ec2-user/*-SNAPSHOT.jar /home/ec2-user/app.jar
            pkill -f 'java -Dfile' || true
            sleep 2
            export JWT_SECRET=${{ secrets.JWT_SECRET }}
            export I_ROUTE_DB_USERNAME=iroute
            export I_ROUTE_DB_PASSWORD=iroute_pw
            export DB_URL="jdbc:mysql://localhost:3306/i_route_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true"
            export MAIL_USERNAME=dev@example.com
            export MAIL_PASSWORD=dev-password
            export KAKAO_CLIENT_ID=${{ secrets.KAKAO_CLIENT_ID }}
            export KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}
            export KAKAO_REDIRECT_URI=https://d3kh3x870d7dr4.cloudfront.net/oauth/kakao/callback
            export AI_SERVER_URL=${{ secrets.AI_SERVER_URL }}
            export SPRING_PROFILES_ACTIVE=prod
            nohup java -Dfile.encoding=UTF-8 -jar /home/ec2-user/app.jar > /home/ec2-user/server.log 2>&1 &
            echo "서버 시작 완료"
