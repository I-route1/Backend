name: Deploy Backend to EC2

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Verify runtime settings deployment code
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Build JAR
        run: |
          chmod +x gradlew && ./gradlew check bootJar
          cp build/libs/backend-*-SNAPSHOT.jar app.jar

      - name: Apply mail and Kakao settings and deploy
        env:
          EC2_KEY: ${{ secrets.EC2_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          KAKAO_ADMIN_KEY: ${{ secrets.KAKAO_ADMIN_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/i-route-deploy-key"
          settings="$RUNNER_TEMP/i-route-runtime-settings.json"
          trap 'rm -f "$key" "$settings"' EXIT
          printf '%s\n' "$EC2_KEY" > "$key"
          python3 scripts/runtime_settings.py pack "$settings"
          stage="/home/ec2-user/.deploy/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          opts=(-i "$key" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 -o ServerAliveInterval=15)
          ssh "${opts[@]}" "ec2-user@$EC2_HOST" "mkdir -p -m 700 '$stage'"
          scp "${opts[@]}" app.jar scripts/runtime_settings.py "ec2-user@$EC2_HOST:$stage/"
          scp "${opts[@]}" "$settings" "ec2-user@$EC2_HOST:$stage/runtime-settings.json"
          ssh "${opts[@]}" "ec2-user@$EC2_HOST" "python3 '$stage/runtime_settings.py' deploy '$stage'"
