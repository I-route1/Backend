plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.i-route'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	runtimeOnly 'com.mysql:mysql-connector-j'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
}

springBoot {
	mainClass = 'com.i_route.backend.BackendApplication'
}

tasks.named('test') {
	useJUnitPlatform()
}

// 기존 테스트의 컴파일 상태와 독립적으로 학습 기록 API 계약과 DB 저장을 검증한다.
sourceSets {
    learningRecordsTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    learningRecordsTestImplementation.extendsFrom testImplementation
    learningRecordsTestRuntimeOnly.extendsFrom testRuntimeOnly
}
tasks.register('learningRecordsTest', Test) {
    description = 'Verifies wrong answers, OCR persistence and attention measurements.'
    group = 'verification'
    testClassesDirs = sourceSets.learningRecordsTest.output.classesDirs
    classpath = sourceSets.learningRecordsTest.runtimeClasspath
    useJUnitPlatform()
}
